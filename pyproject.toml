[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "table-column-same-graph"
version = "0.1.0"
description = "LangGraph workflow for similar Hive warehouse table and column discovery."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "langgraph>=0.2.0,<0.3.0",
  "pyhive[hive]>=0.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0,<8.0.0",
]

[project.scripts]
table-column-same-graph = "table_column_same_graph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
